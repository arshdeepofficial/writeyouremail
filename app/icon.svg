<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Apple Squircle Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Electric Accent Blue Glow -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0055d4"/>
    </linearGradient>

    <!-- Silver Metallic Fold -->
    <linearGradient id="flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d1d6"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0a84ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)" stroke="#27272a" stroke-width="12"/>

  <!-- Ambient Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#blueGlow)" stroke-width="4" opacity="0.3"/>

  <!-- Glowing Envelope Object -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Envelope Main Base -->
    <rect x="96" y="146" width="320" height="220" rx="36" fill="#1c1c1e" stroke="url(#blueGlow)" stroke-width="14"/>

    <!-- V-Fold Silver Line -->
    <path d="M 104 158 L 256 270 L 408 158" fill="none" stroke="url(#flap)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Corner Accents -->
    <path d="M 104 354 L 208 250" fill="none" stroke="#2c2c2e" stroke-width="12" stroke-linecap="round"/>
    <path d="M 408 354 L 304 250" fill="none" stroke="#2c2c2e" stroke-width="12" stroke-linecap="round"/>

    <!-- AI Sparkle Icon on top corner -->
    <path d="M 370 120 L 376 138 L 394 144 L 376 150 L 370 168 L 364 150 L 346 144 L 364 138 Z" fill="#0a84ff"/>
  </g>
</svg>